<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز الدكتور علي محمد وهاس</title>
<style>
*{box-sizing:border-box}
body{
    margin:0; min-height:100vh; font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#eaf7ff 0%,#fff 50%,#edf5ff 100%);
    display:flex; justify-content:center; align-items:center; padding:20px;
}
.card{
    width:100%; max-width:450px; background:#fff; border-radius:28px;
    padding:35px 25px; text-align:center;
    box-shadow:0 15px 45px rgba(0,0,0,.12);
}
.doctor-photo{
    width:150px;height:150px;display:block;margin:0 auto 18px;border-radius:50%;object-fit:cover;
    background:#123b65;color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:40px;box-shadow:0 8px 20px rgba(18,59,101,.25);
}
h1{margin:0;color:#123b65;font-size:25px;line-height:1.6}
.specialty{margin-top:12px;color:#666;font-size:15px;line-height:1.9}
.line{width:70px;height:3px;background:#1c8bc4;margin:22px auto;border-radius:10px}
.contact-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
    padding:17px;margin:14px 0;border-radius:15px;text-decoration:none;color:#fff;
    font-size:17px;font-weight:bold;transition:.2s;box-shadow:0 5px 15px rgba(0,0,0,.08);
}
.contact-btn:hover{transform:translateY(-2px)}
.whatsapp{background:#25D366}
.facebook{background:#1877F2}
.location{background:#E74C3C}
.icon{font-size:22px}
.footer{margin-top:25px;color:#aaa;font-size:12px;line-height:1.7}
.developer{
    margin-top:18px;
    padding-top:13px;
    border-top:1px solid #eee;
    color:#123b65;
    font-size:12px;
    line-height:1.8;
    font-weight:bold;
}
.developer span{direction:ltr;display:inline-block}

</style>
</head>
